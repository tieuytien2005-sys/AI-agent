name: Backend CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Database Setup & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: procurement
          POSTGRES_USER: app
          POSTGRES_PASSWORD: postgreSQL123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://app:postgreSQL123@localhost:5432/procurement
      POSTGRES_DB: procurement
      POSTGRES_USER: app
      DB_PASSWORD: postgreSQL123
      DB_HOST: localhost
      DB_PORT: 5432
      JWT_SECRET_KEY: test_secret_key_ci
      JWT_EXPIRE_HOURS: 8
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile backend/main.py
          find backend ml -name "*.py" -exec python -m py_compile {} +

      - name: Initialize PostgreSQL Schema & Permissions
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgreSQL123 psql -h localhost -U app -d procurement -f db/schema.sql
          PGPASSWORD=postgreSQL123 psql -h localhost -U app -d procurement -f db/permissions.sql

      - name: Load Initial Dataset & Seed Test Data
        run: |
          python db/load_to_postgres.py --dsn "postgresql://app:postgreSQL123@localhost:5432/procurement" --clean-dir ./output --proc-dir ./procurement_data
          python db/seed_test_users.py

      - name: Run Backend Tests
        run: |
          pytest backend/tests ml/tests -v --timeout=120

